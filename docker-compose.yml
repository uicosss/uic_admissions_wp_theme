services:

  # The Application
  app:
    container_name: admissions-app
    build:
      context: ./
      dockerfile: app.dockerfile
    working_dir: /var/www
    volumes:
      - ./:/var/www
    environment:
      - "DB_PORT=${DB_PORT-3306}"
      - "DB_HOST=${DB_HOST:-database}"

  # The Web Server
  web:
    container_name: admissions-web
    build:
      context: ./
      dockerfile: web.dockerfile
    working_dir: /var/www
    volumes_from:
      - app
    ports:
      - "${APP_PORT:-8080}:80"

  # The Database
  database:
    container_name: admissions-db
    image: mariadb:10.3.39
    volumes:
      - admissions_dbdata:/var/lib/mysql
    environment:
      - "MYSQL_DATABASE=${DB_DATABASE:-admissions_local}"
      - "MYSQL_USER=${DB_USERNAME:-mysql_user}"
      - "MYSQL_PASSWORD=${DB_PASSWORD:-localdev}"
      - "MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-localdev}"
    ports:
      - "${FORWARD_DB_PORT:-33061}:${DB_PORT:-3306}"

volumes:
  admissions_dbdata: